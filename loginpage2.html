<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
     <!-- <link rel = "stylesheet" href = "style.css"> -->
      <style>
         *{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
body{
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    /* background: palevioletred; */
    background-image: url('https://wallpaperaccess.com/full/9111714.png');
    background-color: #fff;
    background-size: cover;
    background-position: center;
    border-radius: 40px;
}
.loader{
    height: 400px;
    width: 400px;
    backdrop-filter: blur(20px);
    padding: 30px 40px;
    backdrop-filter: blur(50px);
    box-shadow: 10px 10px 5px black ;
    border-radius: 40px;
}
.loader h1{
    font-size: 40px;
    display: flex;
    justify-content: center;
    align-items: center; 
    color: #fff;  
}
.input-box{
    position: relative;
    width: 100%;
    height: 50px;
    margin: 30px 0 ;
}
.input-box input{
    width: 100%;
    height: 100%;
    border-radius: 10px;
    background-color: rgba(255,255,255 , .5);
    outline: none;
    border: none;
    border-radius: 50px;
    padding-left: 60px; 
}

.input-box .icon1{
    display: flex;
    justify-content: center;
    align-items: center;
    position: absolute;
    left : 15px;
    top: -10%;
    transform: translate(-40%);
    font-size: 30px;
    height: 60px;
    width: 60px;
    background-color: rgb(255,255,255 );
    border-radius: 50%;
}
.input-box .icon2{
    display: flex;
    justify-content: center;
    align-items: center;
    position: absolute;
    right: -10px;
    top: -6px;
    font-size: 30px;
    height: 60px;
    width: 60px;
    background-color: rgb(255,255,255 );
    border-radius: 50%;

}
.loader button{
    width: 100%;
    height: 50px;
    border-radius: 10px;
    background-color: #fff;
    outline: none;
    border: none;
    border-radius: 50px;
    cursor: pointer;

}
button:hover{
    box-shadow: 10px 10px 5px black;
}
      </style>
</head>
<body>
    <div class="loader">
        <h1>Login</h1>
        <div class="input-box">
            <span class="icon1"><i class="fa-solid fa-user"></i></span>
            <input type="text" placeholder="Username"required>
        </div>
        <div class="input-box">
            <span class="icon2"><i class="fa-solid fa-user"></i></span>
            <input type="password" placeholder="password"required>
        </div>
        <button type="submit">Login</button>
    </div>    
</body>
</html>
